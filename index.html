<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Easy - 成人泰語即時學習與翻譯助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVGs 圖標 ---
        const IconVolume = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>;
        const IconBookmark = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>;
        const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
        const IconSearch = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;

        // --- 簡易泰文至羅馬拼音對照映射字典 (用於即時轉拼音) ---
        const ROMAN_MAP = {
            "สวัสดี": "sà-wàt-dee",
            "ครับ": "kráp",
            "ค่ะ": "kâ",
            "ขอบคุณ": "kɔ̀ɔp-kun",
            "มาก": "mâak",
            "เท่าไหร่": "tâo-rài",
            "ห้องน้ำ": "hɔ̂ɔng-nám",
            "อยู่": "yùu",
            "ที่ไหน": "tîi-nǎi",
            "สนามบิน": "sa-nǎam-bin",
            "ไป": "pai",
            "เปิด": "pə̀ət",
            "มิเตอร์": "mi-tə̂ə",
            "ด้วย": "dûai",
            "ขอ": "khɔ̌ɔ",
            "เมนู": "mee-nuu",
            "หน่อย": "nɔ̀ɔi",
            "ไม่": "mâi",
            "เผ็ด": "phet",
            "เช็คบิล": "chék bin",
            "ลด": "lót",
            "ได้ไหม": "dâi mái",
            "อร่อย": "a-rɔ̀ɔi",
            "ยินดี": "yin-dee"
        };

        // 估算/生成羅馬拼音的助手函式
        const generateRomanization = (thaiText) => {
            if (!thaiText) return "";
            // 先尋找完整匹配
            if (ROMAN_MAP[thaiText]) return ROMAN_MAP[thaiText];
            
            // 逐字詞拆解匹配
            let resultRoman = thaiText;
            Object.keys(ROMAN_MAP).forEach(key => {
                if (resultRoman.includes(key)) {
                    resultRoman = resultRoman.replace(new RegExp(key, 'g'), ROMAN_MAP[key] + " ");
                }
            });

            // 若依然有未替換的泰文字元，給予語音提示拼音標記
            if (/[\u0E00-\u0E7F]/.test(resultRoman)) {
                return resultRoman.replace(/[\u0E00-\u0E7F]+/g, (match) => `[${match}]`);
            }
            return resultRoman.trim();
        };

        // --- 內建本地常用詞庫 ---
        const DICTIONARY_DATABASE = [
            {
                thai: "สวัสดีครับ",
                roman: "sà-wàt-dee kráp",
                zh: "你好",
                en: "Hello",
                words: [
                    { thai: "สวัสดี", roman: "sà-wàt-dee", tone: "Low - Mid", pos: "感嘆詞", zh: "你好", en: "Hello" },
                    { thai: "ครับ", roman: "kráp", tone: "High", pos: "語氣詞", zh: "男性敬語助詞", en: "Polite particle" }
                ]
            },
            {
                thai: "ขอบคุณมากครับ",
                roman: "kɔ̀ɔp-kun mâak kráp",
                zh: "非常感謝你",
                en: "Thank you very much",
                words: [
                    { thai: "ขอบคุณ", roman: "kɔ̀ɔp-kun", tone: "Low - Mid", pos: "動詞", zh: "感謝", en: "Thank" },
                    { thai: "มาก", roman: "mâak", tone: "Falling", pos: "副詞", zh: "非常", en: "Very" },
                    { thai: "ครับ", roman: "kráp", tone: "High", pos: "語氣詞", zh: "敬語助詞", en: "Polite particle" }
                ]
            },
            {
                thai: "เท่าไหร่ครับ",
                roman: "tâo-rài kráp",
                zh: "這個多少錢？",
                en: "How much is this?",
                words: [
                    { thai: "เท่าไหร่", roman: "tâo-rài", tone: "Falling - Low", pos: "疑問詞", zh: "多少錢", en: "How much" },
                    { thai: "ครับ", roman: "kráp", tone: "High", pos: "語氣詞", zh: "敬語助詞", en: "Polite particle" }
                ]
            }
        ];

        const CONSONANTS = [
            { char: "ก", name: "ก ไก่", class: "中輔音", mean: "雞" },
            { char: "ข", name: "ข ไข่", class: "高輔音", mean: "蛋" },
            { char: "ค", name: "ค ควาย", class: "低輔音", mean: "水牛" },
            { char: "จ", name: "จ จาน", class: "中輔音", mean: "盤子" },
            { char: "ด", name: "ด เด็ก", class: "中輔音", mean: "小孩" },
            { char: "ต", name: "ต เต่า", class: "中輔音", mean: "烏龜" },
            { char: "น", name: "น หนู", class: "低輔音", mean: "老鼠" },
            { char: "บ", name: "บ ใบไม้", class: "中輔音", mean: "樹葉" },
            { char: "ป", name: "ป ปลา", class: "中輔音", mean: "魚" },
            { char: "ม", name: "ม ม้า", class: "低輔音", mean: "馬" }
        ];

        const CATEGORIZED_PHRASES = [
            {
                category: "✈️ 旅遊交通",
                items: [
                    { thai: "สนามบินอยู่ที่ไหน", roman: "sa-nǎam-bin yùu tîi-nǎi", zh: "機場在哪裡？", en: "Where is the airport?" },
                    { thai: "ไปสยามพารากอนครับ", roman: "pai sa-yǎam phaa-raa-kon kráp", zh: "請帶我去 Siam Paragon", en: "Take me to Siam Paragon" },
                    { thai: "เปิดมิเตอร์ด้วยครับ", roman: "pə̀ət mi-tə̂ə dûai kráp", zh: "請跳錶計費", en: "Turn on meter please" }
                ]
            },
            {
                category: "🍽️ 餐飲夜生活",
                items: [
                    { thai: "ขอเมนูหน่อยครับ", roman: "khɔ̌ɔ mee-nuu nɔ̀ɔi kráp", zh: "請給我菜單", en: "Menu please" },
                    { thai: "ไม่เผ็ดครับ", roman: "mâi phet kráp", zh: "不要辣", en: "Not spicy" },
                    { thai: "เช็คบิลด้วยครับ", roman: "chék bin dûai kráp", zh: "請幫我結帳", en: "Check bill please" }
                ]
            }
        ];

        const TONE_GUIDES = [
            { name: "Mid Tone (平聲)", mark: "無標記", pitch: "33 中平", sample: "มา" },
            { name: "Low Tone (低聲)", mark: "̀ (màa)", pitch: "21 低降", sample: "ม่า" },
            { name: "Falling Tone (落聲)", mark: "̂ (mâa)", pitch: "51 高降", sample: "ม้า" },
            { name: "High Tone (高聲)", mark: "́ (máa)", pitch: "45 高升", sample: "ค้า" },
            { name: "Rising Tone (升聲)", mark: "̌ (mǎa)", pitch: "14 低升", sample: "หมา" }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('translator');
            const [inputText, setInputText] = useState('Hello');
            const [analysisResult, setAnalysisResult] = useState(DICTIONARY_DATABASE[0]);
            const [speechRate, setSpeechRate] = useState(0.85);
            const [savedItems, setSavedItems] = useState([]);
            const [toast, setToast] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            useEffect(() => {
                const stored = localStorage.getItem('thai_easy_notes');
                if (stored) setSavedItems(JSON.parse(stored));
            }, []);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 2500);
            };

            const isThaiText = (text) => /[\u0E00-\u0E7F]/.test(text);

            // 在線翻譯 API：支援 中/英文 轉 泰文，並附帶羅馬拼音
            const handleTranslate = async (queryText) => {
                const text = queryText || inputText;
                if (!text.trim()) return;

                // 本地詞庫匹配
                const localMatch = DICTIONARY_DATABASE.find(item => 
                    item.thai.includes(text) || 
                    item.zh.includes(text) || 
                    item.en.toLowerCase().includes(text.toLowerCase())
                );

                if (localMatch) {
                    setAnalysisResult(localMatch);
                    return;
                }

                // 如果輸入的本身就是泰文
                if (isThaiText(text)) {
                    setAnalysisResult({
                        thai: text,
                        roman: generateRomanization(text),
                        zh: `「${text}」即時發音`,
                        en: text,
                        words: [{ thai: text, roman: generateRomanization(text), tone: "Mid", pos: "詞彙", zh: text, en: text }]
                    });
                    return;
                }

                setIsLoading(true);
                try {
                    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|th`);
                    const data = await res.json();
                    
                    if (data && data.responseData && data.responseData.translatedText) {
                        const translatedThai = data.responseData.translatedText;
                        const generatedRoman = generateRomanization(translatedThai);
                        
                        setAnalysisResult({
                            thai: translatedThai,
                            roman: generatedRoman,
                            zh: text,
                            en: text,
                            words: translatedThai.split(' ').map(w => ({
                                thai: w,
                                roman: generateRomanization(w),
                                tone: "標準",
                                pos: "單詞",
                                zh: text,
                                en: text
                            }))
                        });
                        showToast("翻譯成功！");
                    } else {
                        throw new Error("Translation API Limit");
                    }
                } catch (err) {
                    // Fallback Translate Gateway
                    try {
                        const fallbackRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=th&dt=t&q=${encodeURIComponent(text)}`);
                        const fallbackData = await fallbackRes.json();
                        const translatedThai = fallbackData[0][0][0];
                        const generatedRoman = generateRomanization(translatedThai);

                        setAnalysisResult({
                            thai: translatedThai,
                            roman: generatedRoman,
                            zh: text,
                            en: text,
                            words: [{ thai: translatedThai, roman: generatedRoman, tone: "標準", pos: "單詞", zh: text, en: text }]
                        });
                        showToast("翻譯成功！");
                    } catch (e) {
                        showToast("無法連接翻譯伺服器，請重試");
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            // 語音發音
            const speak = (text) => {
                if (!('speechSynthesis' in window)) {
                    showToast('您的瀏覽器不支援語音發音');
                    return;
                }

                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = speechRate;
                utterance.lang = 'th-TH';

                const voices = window.speechSynthesis.getVoices();
                const thaiVoice = voices.find(v => v.lang === 'th-TH' || v.lang.includes('th'));
                if (thaiVoice) utterance.voice = thaiVoice;

                window.speechSynthesis.speak(utterance);
                showToast(`🔊 正在朗讀泰語: ${text}`);
            };

            const toggleSaveSentence = () => {
                if (!analysisResult) return;
                const exists = savedItems.some(i => i.thai === analysisResult.thai);
                let updated;
                if (exists) {
                    updated = savedItems.filter(i => i.thai !== analysisResult.thai);
                    showToast('已從筆記庫移除');
                } else {
                    updated = [{ id: Date.now(), type: 'sentence', thai: analysisResult.thai, roman: analysisResult.roman, zh: analysisResult.zh }, ...savedItems];
                    showToast('已收藏至筆記庫！');
                }
                setSavedItems(updated);
                localStorage.setItem('thai_easy_notes', JSON.stringify(updated));
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-6">
                    {/* Toast 提示條 */}
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-full shadow-lg text-sm animate-bounce">
                            ✨ {toast}
                        </div>
                    )}

                    {/* Header */}
                    <header className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-2xl bg-amber-400 flex items-center justify-center text-slate-950 font-black text-xl">泰</div>
                            <div>
                                <h1 className="text-xl font-black text-white">Thai Easy</h1>
                                <p className="text-xs text-slate-400">中/英文即時轉泰文與羅馬拼音對照</p>
                            </div>
                        </div>
                        <div className="text-xs text-slate-400">已收藏 <span className="text-amber-400 font-bold">{savedItems.length}</span> 項</div>
                    </header>

                    {/* Nav Tabs */}
                    <div className="flex gap-2 overflow-x-auto pb-2 mb-6 border-b border-slate-800">
                        {[
                            { id: 'translator', label: '⚡ 即時翻譯' },
                            { id: 'alphabet', label: '🔤 字母學習' },
                            { id: 'phrases', label: '💬 實用短句' },
                            { id: 'tones', label: '🎵 聲調圖解' },
                            { id: 'saved', label: `🔖 標記筆記 (${savedItems.length})` }
                        ].map(t => (
                            <button
                                key={t.id}
                                onClick={() => setActiveTab(t.id)}
                                className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all ${
                                    activeTab === t.id ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800'
                                }`}
                            >
                                {t.label}
                            </button>
                        ))}
                    </div>

                    {/* TAB 1: TRANSLATOR */}
                    {activeTab === 'translator' && (
                        <div className="space-y-6">
                            {/* 輸入框 */}
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
                                <label className="text-xs text-slate-400 block mb-2 font-medium">
                                    請輸入 <span className="text-amber-400 font-bold">英文</span> 或 <span className="text-amber-400 font-bold">中文</span> 翻譯成泰文與拼音：
                                </label>
                                <textarea
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    rows={3}
                                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-white text-lg focus:outline-none focus:border-amber-400 resize-none"
                                    placeholder="例如：How much is this? 或 這個多少錢？"
                                />

                                <div className="flex flex-wrap items-center justify-between mt-3 pt-3 border-t border-slate-800 gap-3">
                                    {/* 語速調節 */}
                                    <div className="flex items-center gap-1">
                                        <span className="text-xs text-slate-500 mr-1">語速:</span>
                                        {[0.5, 0.75, 1.0].map(r => (
                                            <button
                                                key={r}
                                                onClick={() => setSpeechRate(r)}
                                                className={`px-2.5 py-1 rounded-lg text-xs font-bold ${speechRate === r ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-400'}`}
                                            >
                                                {r}x
                                            </button>
                                        ))}
                                    </div>

                                    {/* 翻譯與發音按鈕 */}
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => handleTranslate()}
                                            disabled={isLoading}
                                            className="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-1.5 shadow-md disabled:opacity-50"
                                        >
                                            <IconSearch />
                                            <span>{isLoading ? '翻譯中...' : '即時翻譯成泰文'}</span>
                                        </button>
                                        
                                        {analysisResult && (
                                            <button
                                                onClick={() => speak(analysisResult.thai)}
                                                className="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-1.5 border border-slate-700"
                                            >
                                                <IconVolume /> 播泰語音
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* 翻譯結果展示卡片 (包含泰文與羅馬拼音) */}
                            {analysisResult && (
                                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 relative overflow-hidden shadow-2xl">
                                    <div className="absolute top-0 left-0 w-1.5 h-full bg-amber-400"></div>

                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <span className="text-xs font-bold text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-full border border-amber-400/20">
                                                泰文目標結果與羅馬拼音
                                            </span>
                                            
                                            {/* 泰文字體 */}
                                            <h2 className="text-3xl md:text-4xl font-black text-white mt-3 tracking-wide">{analysisResult.thai}</h2>
                                            
                                            {/* 羅馬拼音標記區 */}
                                            <div className="flex items-center gap-2 mt-2">
                                                <span className="text-xs text-slate-500 font-medium">羅馬拼音:</span>
                                                <span className="text-amber-300 font-mono text-base font-semibold bg-slate-950 px-3 py-1 rounded-lg border border-slate-800">
                                                    {analysisResult.roman || generateRomanization(analysisResult.thai)}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="flex gap-2">
                                            {/* 播放按鈕 */}
                                            <button
                                                onClick={() => speak(analysisResult.thai)}
                                                className="p-3 bg-amber-400 hover:bg-amber-300 text-slate-950 rounded-2xl font-bold shadow-lg"
                                                title="播放泰語發音"
                                            >
                                                <IconVolume />
                                            </button>
                                            {/* 收藏按鈕 */}
                                            <button
                                                onClick={toggleSaveSentence}
                                                className={`p-3 rounded-2xl border transition-colors ${savedItems.some(i => i.thai === analysisResult.thai) ? 'bg-amber-400/20 border-amber-400 text-amber-400' : 'bg-slate-800 border-slate-700 text-slate-300'}`}
                                                title="收藏句子"
                                            >
                                                <IconBookmark />
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-4 border-t border-slate-800">
                                        <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                                            <span className="text-xs text-slate-500 block mb-1">原文/中文備註</span>
                                            <p className="text-slate-100 font-semibold">{analysisResult.zh}</p>
                                        </div>
                                        <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                                            <span className="text-xs text-slate-500 block mb-1">Original Input</span>
                                            <p className="text-slate-300">{analysisResult.en}</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* TAB 2: ALPHABET */}
                    {activeTab === 'alphabet' && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                            {CONSONANTS.map((c, idx) => (
                                <div key={idx} onClick={() => speak(c.char)} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-amber-400">
                                    <div className="flex justify-between items-start mb-2">
                                        <span className="text-3xl font-black text-amber-300">{c.char}</span>
                                        <span className="text-amber-400 p-1.5 bg-slate-800 rounded-lg"><IconVolume /></span>
                                    </div>
                                    <p className="text-xs font-bold text-white">{c.name}</p>
                                    <p className="text-[10px] text-amber-400 mt-1">{c.class} ({c.mean})</p>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* TAB 3: PHRASES */}
                    {activeTab === 'phrases' && (
                        <div className="space-y-6">
                            {CATEGORIZED_PHRASES.map((sec, idx) => (
                                <div key={idx} className="space-y-3">
                                    <h3 className="text-sm font-bold text-amber-400">{sec.category}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {sec.items.map((p, pIdx) => (
                                            <div key={pIdx} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                                <div>
                                                    <h4 className="text-lg font-bold text-white">{p.thai}</h4>
                                                    <p className="text-xs font-mono text-amber-300">{p.roman}</p>
                                                    <p className="text-xs text-slate-300 mt-1">{p.zh}</p>
                                                </div>
                                                <button onClick={() => speak(p.thai)} className="p-2.5 bg-slate-800 text-amber-400 rounded-xl"><IconVolume /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* TAB 4: TONES */}
                    {activeTab === 'tones' && (
                        <div className="space-y-3">
                            {TONE_GUIDES.map((t, idx) => (
                                <div key={idx} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                    <div>
                                        <h4 className="text-sm font-bold text-amber-300">{t.name} <span className="text-xs text-slate-400 font-mono font-normal">({t.pitch})</span></h4>
                                        <p className="text-xs text-slate-300 mt-1">標記符號: <span className="text-amber-400 font-mono">{t.mark}</span> | 例字: {t.sample}</p>
                                    </div>
                                    <button onClick={() => speak(t.sample)} className="p-2.5 bg-amber-400 text-slate-950 font-bold rounded-xl flex items-center gap-1.5"><IconVolume /> 播放</button>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* TAB 5: SAVED */}
                    {activeTab === 'saved' && (
                        <div className="space-y-3">
                            {savedItems.length === 0 ? (
                                <p className="text-center text-slate-500 py-12">尚未收藏任何項目</p>
                            ) : (
                                savedItems.map((item) => (
                                    <div key={item.id} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                        <div>
                                            <span className="text-[10px] bg-amber-400/20 text-amber-300 px-2 py-0.5 rounded font-bold">已收藏泰文</span>
                                            <h4 className="text-xl font-bold text-white mt-1">{item.thai}</h4>
                                            <p className="text-xs font-mono text-amber-300 mb-1">{item.roman}</p>
                                            <p className="text-xs text-slate-300">{item.zh}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => speak(item.thai)} className="p-2 bg-slate-800 text-amber-400 rounded-xl"><IconVolume /></button>
                                            <button onClick={() => {
                                                const u = savedItems.filter(i => i.id !== item.id);
                                                setSavedItems(u);
                                                localStorage.setItem('thai_easy_notes', JSON.stringify(u));
                                            }} className="p-2 bg-slate-800 text-rose-400 rounded-xl"><IconTrash /></button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
